<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SEVPC OPENPLAY</title>
<style>
:root{--bg1:#0a0922;--bg2:#1d1250;--card:rgba(24,19,66,.82);--edge:rgba(138,108,255,.45);--cell:rgba(255,255,255,.045);--txt:#f2efff;--mute:#a79fd6;--ball:#d6ff3d;--pink:#ff79d6;--violet:#8a6cff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg1)}
body{margin:0;min-height:100vh;color:var(--txt);font-family:"Trebuchet MS","Helvetica Neue",Arial,sans-serif;background:radial-gradient(900px 600px at 85% -10%,#3a1f8f 0%,transparent 60%),radial-gradient(700px 500px at -10% 100%,#2b1670 0%,transparent 60%),linear-gradient(160deg,var(--bg2),var(--bg1) 70%);background-attachment:fixed;overflow-x:hidden;position:relative}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg svg{position:absolute;opacity:.12;fill:currentColor}
.bg .p1{width:190px;left:-50px;top:18%;transform:rotate(-28deg);color:var(--violet)}
.bg .p2{width:230px;right:-70px;bottom:6%;transform:rotate(24deg);color:var(--pink)}
.bg .b1{width:70px;left:12%;bottom:10%;color:var(--ball);opacity:.18}
.bg .b2{width:46px;right:14%;top:12%;color:var(--ball);opacity:.18}
#calView{display:flex;justify-content:center;padding:48px 12px 28px;position:relative;z-index:1}
.card{position:relative;background:var(--card);border:1px solid var(--edge);border-radius:28px;width:100%;max-width:640px;padding:30px 22px 24px;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 6px rgba(138,108,255,.08);backdrop-filter:blur(6px)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{margin:0;font-size:clamp(44px,12vw,72px);letter-spacing:-.04em;line-height:.9;font-weight:900}
.club{text-align:right;font-weight:800;font-size:clamp(12px,3vw,15px);line-height:1.2;color:var(--mute)}
.hero{position:absolute;right:14px;top:-30px;width:118px;height:118px;pointer-events:none}
.hero img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.cal-wrap{overflow-x:auto;margin-top:24px}
table{border-collapse:separate;border-spacing:6px;width:100%;table-layout:fixed;min-width:400px}
th{font-size:12px;font-weight:800;padding:8px 0;color:var(--mute);background:rgba(138,108,255,.14);border-radius:999px}
td{padding:0;height:74px;vertical-align:top}
td.empty{}
.day{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;width:100%;height:100%;padding:8px;cursor:pointer;font-weight:800;font-size:14px;background:var(--cell);border:1px solid rgba(138,108,255,.25);border-radius:12px;transition:transform .12s,border-color .12s,background .12s}
.day:hover{transform:translateY(-2px);border-color:var(--ball);background:rgba(214,255,61,.08)}
.day:focus-visible{outline:3px solid var(--ball);outline-offset:1px}
.day.has{border-color:rgba(255,121,214,.55);background:rgba(255,121,214,.07)}
.day.dim{opacity:.7}
.day:disabled{cursor:not-allowed;opacity:.35;border-color:rgba(138,108,255,.2);background:var(--cell)}
.day:disabled:hover{transform:none}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;width:max-content;color:#150f3a}
.eve{background:var(--pink)}.noon{background:var(--ball)}
.cnt{font-size:10px;font-weight:700;color:var(--mute)}
.note{margin:18px 4px 0;font-weight:700;font-size:12px;line-height:1.5;color:var(--mute);display:flex;gap:10px;align-items:center}
.note svg{width:26px;flex:none;color:var(--ball);fill:currentColor}

/* Slot view */
#slotView{display:none;position:relative;z-index:1;min-height:100vh;padding:44px clamp(16px,6vw,80px) 40px;font-family:"Arial Black","Trebuchet MS",Arial,sans-serif;font-style:italic}
#slotView h2{margin:0;font-size:clamp(24px,5vw,34px);font-weight:900;display:flex;align-items:center;gap:10px}
#slotView h2 svg{width:30px;color:var(--ball);fill:currentColor}
.when{font-size:13px;font-style:normal;font-family:"Trebuchet MS",Arial,sans-serif;color:var(--mute);margin:6px 0 0}
.screenshot-reminder{font-size:15px;font-style:normal;font-family:"Trebuchet MS",Arial,sans-serif;color:var(--ball);font-weight:900;margin:6px 0 2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(10,auto);grid-auto-flow:column;gap:6px clamp(8px,4vw,60px);margin:28px 0 30px;max-width:900px}
.slot{all:unset;box-sizing:border-box;display:block;padding:8px 6px;font-size:clamp(14px,3.6vw,26px);font-weight:900;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:8px}
.slot:hover{background:rgba(138,108,255,.22)}
.slot:focus-visible{outline:2px solid var(--ball)}
.slot.taken{color:var(--ball)}.slot.taken:hover{background:rgba(255,121,214,.22);text-decoration:line-through}
.slot:disabled{opacity:.3;cursor:not-allowed;background:none}
.slot.taken:disabled{opacity:1;color:var(--ball);cursor:default}.wslot.taken:disabled{color:var(--pink)}
.slot:disabled:hover{background:none;text-decoration:none}
.wl{max-width:900px;margin:0 0 30px}
.wl h3{margin:0;font-size:clamp(18px,4vw,24px);font-weight:900}
.wl .hint{font-size:12px;font-style:normal;font-family:"Trebuchet MS",Arial,sans-serif;color:var(--mute);margin:4px 0 10px}
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wslot{font-size:clamp(13px,3vw,20px)}.wslot.taken{color:var(--pink)}
@media (max-width:520px){.wgrid{grid-template-columns:repeat(2,1fr)}}
.rmtext{margin:0 0 4px;font-size:16px;font-weight:700;line-height:1.4}
.back{all:unset;box-sizing:border-box;cursor:pointer;border:2px solid var(--violet);border-radius:999px;padding:10px 26px;font-weight:800;font-size:16px;font-style:normal;font-family:"Trebuchet MS",Arial,sans-serif;background:rgba(138,108,255,.12)}
.back:hover{background:rgba(138,108,255,.3)}
.back:focus-visible{outline:3px solid var(--ball)}

dialog{border:1px solid var(--edge);border-radius:18px;padding:22px;background:#1a1450;color:var(--txt);width:min(92vw,340px);font-family:"Trebuchet MS",Arial,sans-serif;font-style:normal}
dialog::backdrop{background:rgba(5,4,25,.7)}
dialog h3{margin:0 0 14px;font-size:20px}
label{display:block;font-weight:700;font-size:13px;margin-bottom:6px;color:var(--mute)}
input[type=text]{width:100%;padding:12px;font-size:16px;border:2px solid var(--violet);border-radius:10px;background:#0e0a36;color:var(--txt)}
input:focus-visible{outline:3px solid var(--ball)}
.row{display:flex;gap:8px;margin-top:16px}
.b{flex:1;padding:12px;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;border:2px solid var(--violet);background:transparent;color:var(--txt);font-family:inherit}
.go{background:var(--ball);border-color:var(--ball);color:#150f3a}
@media (prefers-reduced-motion:reduce){.day{transition:none}}
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
var SLOTS = {2:"6-10 pm",3:"6-10 pm",4:"12-3 pm",5:"6-10 pm",6:"12-3 pm",9:"6-10 pm",10:"6-10 pm",11:"12-3 pm",12:"6-10 pm",13:"12-3 pm"};
var YEAR=2026, MONTH=10;
// 12-3 pm dates: 24 slots + 6 waiting list. 6-10 pm dates: 30 slots + 4 waiting list.
function maxSlots(d){ return SLOTS[d] && SLOTS[d].indexOf("12")===0 ? 24 : 30; }
function maxWait(d){ return SLOTS[d] && SLOTS[d].indexOf("12")===0 ? 6 : 4; }
// >>> SETUP: paste your Firebase Realtime Database URL below (see README steps) <<<
var DB_URL = "https://sevpc-281be-default-rtdb.firebaseio.com/"; // e.g. "https://my-club-default-rtdb.firebaseio.com"

var res={}, ready=false, canWrite=true, ops=null;
function persist(){ try{ localStorage.setItem("pb-slots2", JSON.stringify(res)); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]}); }
function D(d){ var x=res[d]; if(!x||!x.slots){ x=res[d]={slots:{},wait:[],wid:[]}; } return x; }
function say(t){ var m=document.getElementById("msg"); m.textContent=t; clearTimeout(say.t); say.t=setTimeout(function(){m.textContent="";},5000); }

// Booking window configuration (all times are Philippine Time, UTC+8)
function pht(y,m,d,h,mi){ return new Date(Date.UTC(y,m,d,h-8,mi||0)); }
function isNoon(d){ return SLOTS[d] && SLOTS[d].indexOf("12")===0; }
function startOf(d){ if(!SLOTS[d]) return null; return pht(YEAR,MONTH,d,isNoon(d)?12:18,0); }
function opensAt(d){
  if(isNoon(d)) return pht(YEAR,MONTH,d-1,20,0); // 12-3 pm dates open 8:00 PM the day before
  return pht(YEAR,MONTH,d,10,0);                 // 6-10 pm dates open 10:00 AM the same day
}
function openLabel(d){
  if(isNoon(d)) return "Opens Nov "+(d-1)+", 8pm";
  return "Opens Nov "+d+", 10am";
}
var OPEN_ALL = false; // true = every schedule is open; set to false to bring back the booking windows
function status(d){
  var st=startOf(d); if(!st) return "none";
  if(OPEN_ALL) return "open";
  var now=new Date(), closes=new Date(st.getTime()-2*3600000);
  if(now<opensAt(d)) return "soon";
  if(now>=closes) return "closed";
  return "open";
}

var cal=document.getElementById("cal");
var first=(new Date(YEAR,MONTH,1).getDay()+6)%7, total=new Date(YEAR,MONTH+1,0).getDate();
function buildCal(){
var h="<thead><tr>"+["Mo","Tu","We","Th","Fr","Sa","Su"].map(function(d){return "<th>"+d+"</th>"}).join("")+"</tr></thead><tbody>", d=1;
for(var r=0;r<6;r++){
if(d>total) break;
h+="<tr>";
for(var c=0;c<7;c++){
if(r*7+c<first||d>total){h+='<td class="empty"></td>';continue;}
var s=SLOTS[d], stt=status(d), n=res[d]&&res[d].slots?Object.keys(res[d].slots).length:0, 
    info = stt==="soon" ? openLabel(d) : (stt==="closed"?"Closed":(n?n+"/"+maxSlots(d):""));
h+='<td><button class="day'+(s?' has':'')+(stt==="soon"||stt==="closed"?' dim':'')+'" data-d="'+d+'"'+(stt==="none"||stt==="soon"?' disabled':'')+' aria-label="November '+d+(stt==="soon"?', not open yet':'')+'">'+d+
(s?'<span class="tag '+(s.indexOf("12")===0?"noon":"eve")+'">'+s+'</span>':'')+
(info?'<span class="cnt">'+info+'</span>':'')+'</button></td>';
d++;
}
h+="</tr>";
}
cal.innerHTML=h+"</tbody>";
}
buildCal();

var calView=document.getElementById("calView"), slotView=document.getElementById("slotView"),
grid=document.getElementById("grid"), dlg=document.getElementById("dlg"), current=null, pick=null;

function promote(){ // local mode: waiting list fills empty numbers in order
var x=D(current), mx=maxSlots(current);
for(var i=1;i<=mx&&x.wait.length;i++){ if(!x.slots[i]) x.slots[i]=x.wait.shift(); }
}
function renderSlots(){
var x=D(current), m=x.slots, mx=maxSlots(current), mw=maxWait(current),
    full=Object.keys(m).length>=mx, h="", w="", isOpen=status(current)==="open";
for(var i=1;i<=mx;i++){
h+='<button class="slot'+(m[i]?' taken':'')+'" data-n="'+i+'"'+(m[i]&&isOpen&&!isRes(current,i)?' title="Tap to edit or remove"':'')+((isOpen&&!isRes(current,i))?'':' disabled')+'>'+i+'.'+(m[i]?' '+esc(m[i]):'')+'</button>';
}
grid.style.gridTemplateRows="repeat("+(mx/3)+",auto)";
grid.innerHTML=h;
for(var j=0;j<mw;j++){
var nm=x.wait[j], off=!nm&&(!full||j!==x.wait.length);
w+='<button class="slot wslot'+(nm?' taken':'')+'" data-w="'+j+'"'+(off||!isOpen?' disabled':'')+'>'+(j+1)+'.'+(nm?' '+esc(nm):'')+'</button>';
}
document.getElementById("wgrid").innerHTML=w;
document.getElementById("whint").textContent=!isOpen?"Reservations are closed for this date.":(full?"All slots are full. Join the list and you move up when a spot opens.":"Opens when all "+mx+" slots are taken.");
var cl=new Date(startOf(current).getTime()-7200000);
document.getElementById("when").textContent="November "+current+" \u00b7 "+SLOTS[current]+" \u00b7 "+(isOpen?(OPEN_ALL?"Reservations open":"Reservations close at "+cl.toLocaleTimeString([],{hour:"numeric",minute:"2-digit",timeZone:"Asia/Manila"})):"Reservations closed");
document.getElementById("mode").textContent=!ready?"Connecting\u2026":(!fdb?"Setup needed: add your Firebase URL at the top of the script. Until then bookings are saved on this device only.":(connErr?"Can't reach the booking server right now.":""));
}
function refresh(){ if(slotView.style.display==="block"){ if(!dlg.open) renderSlots(); } else buildCal(); }
function show(v){
calView.style.display=v==="cal"?"flex":"none";
slotView.style.display=v==="slot"?"block":"none";
window.scrollTo(0,0);
}
cal.addEventListener("click",function(e){
var b=e.target.closest(".day"); if(!b) return;
current=+b.dataset.d; renderSlots(); show("slot");
});
document.getElementById("back").onclick=function(){
buildCal(); show("cal");
var b=cal.querySelector('[data-d="'+current+'"]'); if(b) b.focus();
};

// ---- Race Condition Helper: Find next available slot number ----
function findNextAvailable(slotsMap, startNum, maxSlots) {
  for (let i = startNum; i <= maxSlots; i++) {
    if (!slotsMap[i]) return i;
  }
  for (let i = 1; i < startNum; i++) {
    if (!slotsMap[i]) return i;
  }
  return null;
}

// ---- Storage: Firebase Realtime Database (shared) or this device (fallback) ----
var local={
reserve:async function(d,n,name){ 
  var x=D(d), mx=maxSlots(d);
  let targetSlot = n;
  if (x.slots[targetSlot]) {
    targetSlot = findNextAvailable(x.slots, n, mx);
  }
  if (!targetSlot) {
    if (x.wait.length >= maxWait(d)) return {ok:false, msg:"All slots and the waiting list are full."};
    x.wait.push(name);
    persist();
    return {ok:true};
  }
  x.slots[targetSlot] = name; 
  persist(); 
  return {ok:true}; 
},
join:async function(d,name){ var x=D(d); if(x.wait.length>=maxWait(d)) return {ok:false,msg:"The waiting list is full."}; x.wait.push(name); persist(); return {ok:true}; },
rmSlot:async function(d,n){ var x=D(d); delete x.slots[n]; promote(); persist(); return {ok:true}; },
rmWait:async function(d,i){ D(d).wait.splice(i,1); persist(); return {ok:true}; },
edit:async function(d,w,i,old,nm){
var x=D(d);
if((w?x.wait[i]:x.slots[i])!==old) return {ok:false,msg:"That booking just changed. Please check the list."};
if(w) x.wait[i]=nm; else x.slots[i]=nm;
persist(); return {ok:true};
}
};
var fdb=null, connErr=false;
function toArr(v){ if(!v) return []; if(Array.isArray(v)) return v.filter(Boolean); return Object.keys(v).sort(function(a,b){return a-b}).map(function(k){return v[k]}).filter(Boolean); }
function normSlots(v){ var o={}; if(!v) return o; Object.keys(v).forEach(function(k){ if(v[k]) o[k]=v[k]; }); return o; }
// Every change runs as a transaction on that date, so two people booking at once never overwrite each other.
function tx(d,fn){
var out={ok:false,msg:"Could not save. Please try again."};
return fdb.ref("pb/d"+d).transaction(function(cur){
var x={slots:normSlots(cur&&cur.slots),wait:toArr(cur&&cur.wait)};
out=fn(x);
if(!out.ok) return;
return (Object.keys(x.slots).length||x.wait.length)?x:null;
}).then(function(t){ return t.committed?out:(out.ok?{ok:false,msg:"Could not save. Please try again."}:out); })
.catch(function(){ return {ok:false,msg:"Could not save. Check your connection."}; });
}
var remote={
reserve:function(d,n,name){ 
  return tx(d,function(x){ 
    var mx=maxSlots(d);
    let targetSlot = n;
    if (x.slots[targetSlot]) {
      targetSlot = findNextAvailable(x.slots, n, mx);
    }
    if (!targetSlot) {
      if (x.wait.length >= maxWait(d)) return {ok:false, msg:"All slots and the waiting list are full."};
      x.wait.push(name);
      return {ok:true};
    }
    x.slots[targetSlot] = name; 
    return {ok:true}; 
  }); 
},
join:function(d,name){ return tx(d,function(x){ if(x.wait.length>=maxWait(d)) return {ok:false,msg:"The waiting list is full."}; x.wait.push(name); return {ok:true}; }); },
rmSlot:function(d,n,name){ return tx(d,function(x){
if(x.slots[n]!==name) return {ok:false,msg:"That booking just changed. Please check the list."};
delete x.slots[n];
if(x.wait.length) x.slots[n]=x.wait.shift(); // waiting list #1 fills the empty number
return {ok:true};
}); },
rmWait:function(d,i,name){ return tx(d,function(x){ if(x.wait[i]!==name) return {ok:false,msg:"That booking just changed. Please check the list."}; x.wait.splice(i,1); return {ok:true}; }); },
edit:function(d,w,i,old,nm){ return tx(d,function(x){
if((w?x.wait[i]:x.slots[i])!==old) return {ok:false,msg:"That booking just changed. Please check the list."};
if(w) x.wait[i]=nm; else x.slots[i]=nm;
return {ok:true};
}); }
};
var configured=/^https:\/\//.test(DB_URL)&&DB_URL.indexOf("PASTE")<0;

// ---- Pre-reserved slots (always kept; change names here) ----
var RESERVED={}, RESERVED_DATES=[], seeding={}; // empty = no pre-reserved slots

// ---- Limit: each device can hold at most MAX_PER_DEVICE reservations per date ----
var MAX_PER_DEVICE=2, mine={};
try{ mine=JSON.parse(localStorage.getItem("pb-mine")||"{}"); }catch(e){}
function saveMine(){ try{ localStorage.setItem("pb-mine",JSON.stringify(mine)); }catch(e){} }
function myCount(d){ // my recorded bookings that still exist on the list (slots + waiting list)
  var x=D(d), present=Object.keys(x.slots).map(function(k){return x.slots[k];}).concat(x.wait), n=0;
  (mine[d]||[]).forEach(function(nm){ var i=present.indexOf(nm); if(i>=0){ present.splice(i,1); n++; } });
  return n;
}
function addMine(d,nm){ (mine[d]=mine[d]||[]).push(nm); saveMine(); }
function dropMine(d,nm){ var a=mine[d]||[], i=a.indexOf(nm); if(i>=0){ a.splice(i,1); saveMine(); } }
var LIMIT_MSG="Limit reached: only "+MAX_PER_DEVICE+" slots per device for each date.";
function isRes(d,n){ return RESERVED_DATES.indexOf(+d)>=0 && !!RESERVED[n]; }
function applyReserved(x,d){
  var mx=maxSlots(d), changed=false;
  Object.keys(RESERVED).forEach(function(n){
    var nm=RESERVED[n], old=x.slots[n];
    if(old===nm) return;
    x.slots[n]=nm; changed=true;
    if(old){
      var t=findNextAvailable(x.slots,4,mx);
      if(t) x.slots[t]=old; else x.wait.unshift(old);
    }
  });
  return changed;
}
function seedAll(){
  RESERVED_DATES.forEach(function(d){
    var s=(res[d]&&res[d].slots)||{}, ok=true;
    Object.keys(RESERVED).forEach(function(n){ if(s[n]!==RESERVED[n]) ok=false; });
    if(ok||seeding[d]) return;
    seeding[d]=true;
    tx(d,function(x){ return {ok:applyReserved(x,d)}; }).then(function(){ seeding[d]=false; });
  });
}
function seedLocal(){
  RESERVED_DATES.forEach(function(d){ applyReserved(D(d),d); });
  persist();
}

function init(){
if(configured&&window.firebase){
try{
firebase.initializeApp({databaseURL:DB_URL}); fdb=firebase.database(); ops=remote;
fdb.ref("pb").on("value",function(s){
connErr=false; var v=s.val()||{}; res={};
Object.keys(v).forEach(function(k){ var d=+k.slice(1), x=v[k]||{}; res[d]={slots:normSlots(x.slots),wait:toArr(x.wait),wid:[]}; });
ready=true; refresh(); seedAll();
},function(){ connErr=true; ready=true; refresh(); });
}catch(e){ fdb=null; }
}
if(!fdb){ ops=local; try{ res=JSON.parse(localStorage.getItem("pb-slots2")||"{}"); }catch(e){} seedLocal(); ready=true; refresh(); }
}

// ---- Dialog ----
var formEl=document.getElementById("form"), rmEl=document.getElementById("rm");
function openDlg(kind){ formEl.style.display=kind==="form"?"block":"none"; rmEl.style.display=kind==="rm"?"block":"none"; dlg.showModal(); }
function onPick(e){
var b=e.target.closest(".slot"); if(!b||b.disabled) return;
if(status(current)!=="open"){renderSlots();return;}
if(!ready){say("Connecting\u2026 try again in a moment.");return;}
if(!canWrite){say("View only: ask the organizer for contributor access to reserve.");return;}
var x=D(current), isW=b.dataset.w!==undefined;
pick={w:isW,i:isW?+b.dataset.w:+b.dataset.n,edit:false};
var nm=isW?x.wait[pick.i]:x.slots[pick.i]; pick.name=nm;
if(nm){
document.getElementById("rmtext").textContent="Edit or remove "+nm+" ("+(isW?"waiting list "+(pick.i+1):"slot "+pick.i)+")?";
openDlg("rm");
}else{
if(myCount(current)>=MAX_PER_DEVICE){say(LIMIT_MSG);return;}
document.getElementById("dtitle").textContent=isW?"Join waiting list":"Reserve slot "+pick.i;
document.getElementById("save").textContent=isW?"Join":"Reserve";
document.getElementById("name").value="";
openDlg("form"); document.getElementById("name").focus();
}
}
grid.addEventListener("click",onPick);
document.getElementById("wgrid").addEventListener("click",onPick);
document.getElementById("cancel").onclick=function(){dlg.close();};
document.getElementById("rmno").onclick=function(){dlg.close();};
document.getElementById("rmedit").onclick=function(){
pick.edit=true;
document.getElementById("dtitle").textContent="Edit "+(pick.w?"waiting list "+(pick.i+1):"slot "+pick.i);
document.getElementById("save").textContent="Save";
var n=document.getElementById("name"); n.value=pick.name;
rmEl.style.display="none"; formEl.style.display="block";
n.focus(); n.select();
};
document.getElementById("rmyes").onclick=async function(){
var d=current;
if(status(d)!=="open"){dlg.close();renderSlots();return;}
var r=pick.w?await ops.rmWait(d,pick.i,pick.name):await ops.rmSlot(d,pick.i,pick.name);
if(r.ok) dropMine(d,pick.name);
dlg.close(); if(!r.ok) say(r.msg); renderSlots();
};
formEl.addEventListener("submit",async function(){
var name=document.getElementById("name").value.trim().slice(0,30), d=current;
if(status(d)!=="open"){dlg.close();renderSlots();return;}
if(!name){document.getElementById("name").focus();return;}
if(pick.edit&&name===pick.name){dlg.close();return;}
if(!pick.edit&&myCount(d)>=MAX_PER_DEVICE){dlg.close();say(LIMIT_MSG);renderSlots();return;}
var r=pick.edit?await ops.edit(d,pick.w,pick.i,pick.name,name)
:(pick.w?await ops.join(d,name):await ops.reserve(d,pick.i,name));
if(r.ok){ if(pick.edit){ var a=mine[d]||[], k=a.indexOf(pick.name); if(k>=0){ a[k]=name; saveMine(); } } else addMine(d,name); }
dlg.close(); if(!r.ok) say(r.msg); renderSlots();
});
setInterval(refresh,30000);
init();
</script>
</body>
